# HAPI FHIR Server R4
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hapi-fhir
  namespace: clinica-distribuida
spec:
  replicas: 1
  selector:
    matchLabels:
      app: hapi-fhir
  template:
    metadata:
      labels:
        app: hapi-fhir
    spec:
      containers:
      - name: hapi-fhir
        image: hapiproject/hapi:v7.2.0
        env:
        - name: hapi.fhir.fhir_version
          value: R4
        ports:
        - containerPort: 8080
        readinessProbe:
          httpGet:
            path: /fhir/metadata
            port: 8080
          initialDelaySeconds: 25
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /fhir/metadata
            port: 8080
          initialDelaySeconds: 40
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: hapi-fhir
  namespace: clinica-distribuida
spec:
  selector:
    app: hapi-fhir
  ports:
  - port: 8080
    targetPort: 8080
---
# Health Service Bus (HSB)
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hsb-bus
  namespace: clinica-distribuida
spec:
  replicas: 2
  selector:
    matchLabels:
      app: hsb-bus
  template:
    metadata:
      labels:
        app: hsb-bus
    spec:
      containers:
      - name: hsb
        image: clinica/hsb:latest
        env:
        - name: HAPI_FHIR_URL
          value: http://hapi-fhir:8080/fhir
        ports:
        - containerPort: 8001
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: hsb-bus
  namespace: clinica-distribuida
spec:
  selector:
    app: hsb-bus
  ports:
  - port: 8001
    targetPort: 8001
---
# API Gateway y Vistas Clínicas
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: clinica-distribuida
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
      - name: api
        image: clinica/api:latest
        env:
        - name: HSB_URL
          value: http://hsb-bus:8001
        ports:
        - containerPort: 8000
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: clinica-distribuida
spec:
  type: NodePort
  selector:
    app: api-gateway
  ports:
  - port: 8000
    targetPort: 8000
    nodePort: 30080
