# infra/k8s/02_hapi_hsb_api.yaml  (bonus: Kubernetes en Minikube)
# HAPI FHIR R4, Health Service Bus y API Gateway.
# Las imágenes clinica/hsb y clinica/api se construyen dentro del Docker de Minikube
# (ver infra/k8s/desplegar.sh), por eso imagePullPolicy: Never.
apiVersion: v1
kind: ConfigMap
metadata:
  name: conexiones-sedes
  namespace: clinica-distribuida
data:
  DB_HOST_SEDE1: pg-sede1
  DB_PORT_SEDE1: "5432"
  DB_NAME_SEDE1: clinica_sincelejo
  DB_NAME_SEDE2: clinica_cartagena
  DB_HOST_SEDE3: pg-sede3
  DB_PORT_SEDE3: "5432"
  DB_NAME_SEDE3: clinica_corozal
  HAPI_FHIR_URL: http://hapi-fhir:8080/fhir
  FHIR_FULLURL_BASE: http://hapi-fhir:8080/fhir
---
apiVersion: v1
kind: Secret
metadata: {name: jwt, namespace: clinica-distribuida}
type: Opaque
stringData:
  JWT_SECRET: CAMBIAR_SECRETO_SOLO_PARA_DESARROLLO_EN_MINIKUBE
---
# ── HAPI FHIR R4 ──────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata: {name: hapi-fhir, namespace: clinica-distribuida}
spec:
  replicas: 1
  selector: {matchLabels: {app: hapi-fhir}}
  template:
    metadata: {labels: {app: hapi-fhir}}
    spec:
      containers:
      - name: hapi-fhir
        image: hapiproject/hapi:v7.2.0
        env:
        - {name: hapi.fhir.fhir_version, value: R4}
        - {name: JAVA_TOOL_OPTIONS, value: "-Xms256m -Xmx768m"}
        ports: [{containerPort: 8080}]
        # La imagen no tiene shell: las probes HTTP las hace el kubelet desde fuera.
        startupProbe:
          httpGet: {path: /fhir/metadata, port: 8080}
          periodSeconds: 10
          failureThreshold: 30          # hasta 5 min para el primer arranque
        readinessProbe:
          httpGet: {path: /fhir/metadata, port: 8080}
          periodSeconds: 10
        livenessProbe:
          httpGet: {path: /fhir/metadata, port: 8080}
          periodSeconds: 20
          timeoutSeconds: 5
        resources: {requests: {memory: 512Mi}, limits: {memory: 1Gi}}
---
apiVersion: v1
kind: Service
metadata: {name: hapi-fhir, namespace: clinica-distribuida}
spec:
  type: NodePort
  selector: {app: hapi-fhir}
  ports: [{port: 8080, targetPort: 8080, nodePort: 30090}]
---
# ── Health Service Bus ────────────────────────────────────────────────────
# 1 réplica: la cola de reintentos recupera los pendientes desde las bases al arrancar;
# con varias réplicas habría que repartir esa recuperación (p. ej. con un candado en la sede).
apiVersion: apps/v1
kind: Deployment
metadata: {name: hsb-bus, namespace: clinica-distribuida}
spec:
  replicas: 1
  selector: {matchLabels: {app: hsb-bus}}
  template:
    metadata: {labels: {app: hsb-bus}}
    spec:
      containers:
      - name: hsb
        image: clinica/hsb:v2
        imagePullPolicy: Never
        envFrom:
        - configMapRef: {name: conexiones-sedes}
        - secretRef: {name: credenciales-bd}
        env:
        - {name: HSB_MAX_RETRIES, value: "7"}
        - {name: HSB_RETRY_BASE_SECONDS, value: "2"}
        ports: [{containerPort: 8001}]
        readinessProbe:
          httpGet: {path: /health, port: 8001}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet: {path: /metrics, port: 8001}
          initialDelaySeconds: 20
          periodSeconds: 20
          timeoutSeconds: 10
        resources: {requests: {memory: 96Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: hsb, namespace: clinica-distribuida}
spec:
  type: NodePort
  selector: {app: hsb-bus}
  ports: [{port: 8001, targetPort: 8001, nodePort: 30081}]
---
# ── API Gateway y vistas por rol ──────────────────────────────────────────
# Sin estado propio (JWT + auditoría en pg-central con candado), escala horizontalmente.
apiVersion: apps/v1
kind: Deployment
metadata: {name: api-gateway, namespace: clinica-distribuida}
spec:
  replicas: 2
  selector: {matchLabels: {app: api-gateway}}
  template:
    metadata: {labels: {app: api-gateway}}
    spec:
      containers:
      - name: api
        image: clinica/api:v2
        imagePullPolicy: Never
        envFrom:
        - configMapRef: {name: conexiones-sedes}
        - secretRef: {name: credenciales-bd}
        - secretRef: {name: jwt}
        env:
        - {name: JWT_ALGORITHM, value: HS256}
        - {name: JWT_EXPIRE_MINUTES, value: "60"}
        - {name: HSB_URL, value: "http://hsb:8001"}
        - {name: HSB_METRICS_URL, value: "http://hsb:8001/metrics"}
        - {name: AUDIT_DB_HOST, value: pg-central}
        - {name: AUDIT_DB_PORT, value: "5432"}
        - {name: AUDIT_DB_NAME, value: clinica_central}
        ports: [{containerPort: 8000}]
        readinessProbe:
          httpGet: {path: /health, port: 8000}
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 10
        livenessProbe:
          httpGet: {path: /login, port: 8000}
          initialDelaySeconds: 20
          periodSeconds: 20
        resources: {requests: {memory: 96Mi}, limits: {memory: 256Mi}}
---
apiVersion: v1
kind: Service
metadata: {name: api-gateway, namespace: clinica-distribuida}
spec:
  type: NodePort
  selector: {app: api-gateway}
  ports: [{port: 8000, targetPort: 8000, nodePort: 30080}]
