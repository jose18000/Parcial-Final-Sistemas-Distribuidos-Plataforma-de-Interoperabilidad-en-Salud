# infra/k8s/01_postgres_sedes.yaml  (bonus: Kubernetes en Minikube)
# Capa de datos con motores heterogéneos:
#   Sede 1 Sincelejo -> PostgreSQL   Sede 2 Cartagena -> MongoDB   Sede 3 Corozal -> PostgreSQL
#   pg-central       -> PostgreSQL (cadena de auditoría)
# Los scripts de inicialización se montan desde ConfigMaps que crea infra/k8s/desplegar.sh
# a partir de db/ (una sola fuente para Docker Compose y Kubernetes).
apiVersion: v1
kind: Namespace
metadata:
  name: clinica-distribuida
---
# Credenciales de desarrollo (datos sintéticos). En producción irían en un gestor de secretos.
apiVersion: v1
kind: Secret
metadata:
  name: credenciales-bd
  namespace: clinica-distribuida
type: Opaque
stringData:
  POSTGRES_USER: clinica_user
  POSTGRES_PASSWORD: clinica_pass_2026
  MONGO_URL_SEDE2: mongodb://clinica_user:clinica_pass_2026@mongo-sede2:27017/?authSource=admin
---
# ── Sede 1: Sincelejo · PostgreSQL ─────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: datos-pg-sede1, namespace: clinica-distribuida}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-sede1, namespace: clinica-distribuida}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pg-sede1}}
  template:
    metadata: {labels: {app: pg-sede1, rol: sede, motor: postgresql}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{secretRef: {name: credenciales-bd}}]
        env: [{name: POSTGRES_DB, value: clinica_sincelejo}]
        ports: [{containerPort: 5432}]
        volumeMounts:
        - {name: datos, mountPath: /var/lib/postgresql/data, subPath: pgdata}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d clinica_sincelejo"]}
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d clinica_sincelejo"]}
          initialDelaySeconds: 20
          periodSeconds: 15
        resources: {requests: {memory: 64Mi}, limits: {memory: 256Mi}}
      volumes:
      - {name: datos, persistentVolumeClaim: {claimName: datos-pg-sede1}}
      - {name: init, configMap: {name: init-sede1}}
---
apiVersion: v1
kind: Service
metadata: {name: pg-sede1, namespace: clinica-distribuida}
spec: {selector: {app: pg-sede1}, ports: [{port: 5432, targetPort: 5432}]}
---
# ── Sede 2: Cartagena · MongoDB ────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: datos-mongo-sede2, namespace: clinica-distribuida}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: mongo-sede2, namespace: clinica-distribuida}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: mongo-sede2}}
  template:
    metadata: {labels: {app: mongo-sede2, rol: sede, motor: mongodb}}
    spec:
      containers:
      - name: mongo
        image: mongo:7.0
        args: ["--wiredTigerCacheSizeGB", "0.25"]
        env:
        - name: MONGO_INITDB_ROOT_USERNAME
          valueFrom: {secretKeyRef: {name: credenciales-bd, key: POSTGRES_USER}}
        - name: MONGO_INITDB_ROOT_PASSWORD
          valueFrom: {secretKeyRef: {name: credenciales-bd, key: POSTGRES_PASSWORD}}
        - {name: MONGO_INITDB_DATABASE, value: clinica_cartagena}
        ports: [{containerPort: 27017}]
        volumeMounts:
        - {name: datos, mountPath: /data/db}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
        readinessProbe:
          exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          exec: {command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]}
          initialDelaySeconds: 30
          periodSeconds: 20
        resources: {requests: {memory: 128Mi}, limits: {memory: 512Mi}}
      volumes:
      - {name: datos, persistentVolumeClaim: {claimName: datos-mongo-sede2}}
      - {name: init, configMap: {name: init-sede2}}
---
apiVersion: v1
kind: Service
metadata: {name: mongo-sede2, namespace: clinica-distribuida}
spec: {selector: {app: mongo-sede2}, ports: [{port: 27017, targetPort: 27017}]}
---
# ── Sede 3: Corozal · PostgreSQL ───────────────────────────────────────────
