# ── Base central de auditoría ──────────────────────────────────────────────
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: datos-pg-central, namespace: clinica-distribuida}
spec: {accessModes: [ReadWriteOnce], resources: {requests: {storage: 1Gi}}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: pg-central, namespace: clinica-distribuida}
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector: {matchLabels: {app: pg-central}}
  template:
    metadata: {labels: {app: pg-central, rol: auditoria, motor: postgresql}}
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        envFrom: [{secretRef: {name: credenciales-bd}}]
        env: [{name: POSTGRES_DB, value: clinica_central}]
        ports: [{containerPort: 5432}]
        volumeMounts:
        - {name: datos, mountPath: /var/lib/postgresql/data, subPath: pgdata}
        - {name: init, mountPath: /docker-entrypoint-initdb.d}
        readinessProbe:
          exec: {command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d clinica_central"]}
          initialDelaySeconds: 5
          periodSeconds: 10
        resources: {requests: {memory: 64Mi}, limits: {memory: 256Mi}}
      volumes:
      - {name: datos, persistentVolumeClaim: {claimName: datos-pg-central}}
      - {name: init, configMap: {name: init-central}}
---
apiVersion: v1
kind: Service
metadata: {name: pg-central, namespace: clinica-distribuida}
spec: {selector: {app: pg-central}, ports: [{port: 5432, targetPort: 5432}]}
