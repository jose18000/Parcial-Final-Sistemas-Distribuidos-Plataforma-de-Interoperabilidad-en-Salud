apiVersion: v1
kind: Namespace
metadata:
  name: clinica-distribuida
---
# Sede 1: Sincelejo PostgreSQL
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pg-sede1
  namespace: clinica-distribuida
spec:
  replicas: 1
  selector:
    matchLabels:
      app: pg-sede1
  template:
    metadata:
      labels:
        app: pg-sede1
    spec:
      containers:
      - name: postgres
        image: postgres:16-alpine
        env:
        - name: POSTGRES_USER
          value: clinica_user
        - name: POSTGRES_PASSWORD
          value: clinica_pass_2026
        - name: POSTGRES_DB
          value: clinica_sincelejo
        ports:
        - containerPort: 5432
        readinessProbe:
          exec:
            command: ["pg_isready", "-U", "clinica_user", "-d", "clinica_sincelejo"]
          initialDelaySeconds: 5
          periodSeconds: 10
        livenessProbe:
          exec:
            command: ["pg_isready", "-U", "clinica_user", "-d", "clinica_sincelejo"]
          initialDelaySeconds: 15
          periodSeconds: 15
---
apiVersion: v1
kind: Service
metadata:
  name: pg-sede1
  namespace: clinica-distribuida
spec:
  selector:
    app: pg-sede1
  ports:
  - port: 5432
    targetPort: 5432
