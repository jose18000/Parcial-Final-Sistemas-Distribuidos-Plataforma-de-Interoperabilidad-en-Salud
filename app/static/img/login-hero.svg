<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1400" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Ilustración: red de tres sedes hospitalarias conectadas">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#0b4f59"/>
      <stop offset="0.55" stop-color="#0f6b78"/>
      <stop offset="1" stop-color="#12838f"/>
    </linearGradient>
    <linearGradient id="edif" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4fbfc"/>
      <stop offset="1" stop-color="#d7ecef"/>
    </linearGradient>
    <linearGradient id="vidrio" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fd9e0"/>
      <stop offset="1" stop-color="#5fb8c4"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7fe3ec" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7fe3ec" stop-opacity="0"/>
    </radialGradient>
    <pattern id="retic" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <g id="ventanas">
      <rect width="22" height="26" rx="3" fill="url(#vidrio)"/>
    </g>
  </defs>

  <rect width="1200" height="1400" fill="url(#cielo)"/>
  <rect width="1200" height="1400" fill="url(#retic)"/>

  <!-- Pulso cardiaco de fondo -->
  <path d="M0 360 H330 l30 -70 l40 150 l40 -190 l35 110 H1200" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Conexiones entre sedes -->
  <g fill="none" stroke="#bff3f8" stroke-opacity="0.55" stroke-width="3" stroke-dasharray="10 12" stroke-linecap="round">
    <path d="M250 820 C 420 640, 780 640, 950 800"/>
    <path d="M250 820 C 420 960, 500 1010, 600 1010"/>
    <path d="M950 800 C 820 960, 700 1010, 600 1010"/>
  </g>
  <circle cx="600" cy="700" r="170" fill="url(#halo)"/>
  <!-- Nodo central (plataforma) -->
  <g transform="translate(600 700)">
    <circle r="62" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="40" fill="#ffffff"/>
    <path d="M-8 -24 h16 v16 h16 v16 h-16 v16 h-16 v-16 h-16 v-16 h16z" fill="#0f6b78"/>
  </g>

  <!-- Sede 1 -->
  <g transform="translate(130 760)">
    <ellipse cx="120" cy="240" rx="150" ry="18" fill="#063840" fill-opacity="0.35"/>
    <rect x="20" y="40" width="200" height="200" rx="10" fill="url(#edif)"/>
    <rect x="90" y="0" width="60" height="60" rx="8" fill="#ffffff"/>
    <path d="M114 12 h12 v12 h12 v12 h-12 v12 h-12 v-12 h-12 v-12 h12z" fill="#d64545"/>
    <g>
      <use href="#ventanas" x="44" y="70"/><use href="#ventanas" x="84" y="70"/><use href="#ventanas" x="134" y="70"/><use href="#ventanas" x="174" y="70"/>
      <use href="#ventanas" x="44" y="118"/><use href="#ventanas" x="84" y="118"/><use href="#ventanas" x="134" y="118"/><use href="#ventanas" x="174" y="118"/>
    </g>
    <rect x="98" y="180" width="44" height="60" rx="4" fill="#0f6b78"/>
  </g>

  <!-- Sede 2 -->
  <g transform="translate(830 730)">
    <ellipse cx="120" cy="270" rx="160" ry="18" fill="#063840" fill-opacity="0.35"/>
    <rect x="10" y="20" width="220" height="250" rx="10" fill="url(#edif)"/>
    <rect x="10" y="20" width="220" height="34" rx="10" fill="#e6f5f7"/>
    <path d="M108 26 h24 v8 h8 v8 h-8 v8 h-24 v-8 h-8 v-8 h8z" fill="#d64545" transform="translate(0 -2) scale(1)"/>
    <g>
      <use href="#ventanas" x="34" y="74"/><use href="#ventanas" x="74" y="74"/><use href="#ventanas" x="144" y="74"/><use href="#ventanas" x="184" y="74"/>
      <use href="#ventanas" x="34" y="122"/><use href="#ventanas" x="74" y="122"/><use href="#ventanas" x="144" y="122"/><use href="#ventanas" x="184" y="122"/>
      <use href="#ventanas" x="34" y="170"/><use href="#ventanas" x="74" y="170"/><use href="#ventanas" x="144" y="170"/><use href="#ventanas" x="184" y="170"/>
    </g>
    <rect x="96" y="210" width="48" height="60" rx="4" fill="#0f6b78"/>
  </g>

  <!-- Sede 3 -->
  <g transform="translate(490 960)">
    <ellipse cx="110" cy="200" rx="140" ry="16" fill="#063840" fill-opacity="0.35"/>
    <rect x="10" y="40" width="200" height="160" rx="10" fill="url(#edif)"/>
    <path d="M10 50 L110 0 L210 50 Z" fill="#e6f5f7"/>
    <circle cx="110" cy="34" r="14" fill="#ffffff"/>
    <path d="M106 24 h8 v6 h6 v8 h-6 v6 h-8 v-6 h-6 v-8 h6z" fill="#d64545"/>
    <g>
      <use href="#ventanas" x="34" y="76"/><use href="#ventanas" x="74" y="76"/><use href="#ventanas" x="124" y="76"/><use href="#ventanas" x="164" y="76"/>
    </g>
    <rect x="88" y="140" width="44" height="60" rx="4" fill="#0f6b78"/>
  </g>

  <!-- Paquetes de datos viajando -->
  <g fill="#ffffff">
    <circle cx="420" cy="700" r="6"/><circle cx="790" cy="705" r="6"/><circle cx="470" cy="955" r="5"/><circle cx="760" cy="930" r="5"/>
  </g>

  <!-- Suelo -->
  <path d="M0 1200 C 300 1150, 900 1150, 1200 1200 V1400 H0Z" fill="#0b4f59" fill-opacity="0.55"/>
</svg>
