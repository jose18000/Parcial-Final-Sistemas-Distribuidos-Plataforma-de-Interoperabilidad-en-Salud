<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ titulo }} · Historia Clínica Electrónica</title>
  <link rel="icon" href="/static/logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/static/plataforma.css">
  <style>
    .error-pagina { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
      background: radial-gradient(1200px 500px at 50% -10%, rgba(15,107,120,.18), transparent 70%), var(--fondo, #f3f6f8); }
    .error-tarjeta { max-width: 520px; width: 100%; background: var(--superficie, #fff); border-radius: 16px;
      box-shadow: 0 18px 50px rgba(9,40,48,.14); padding: 36px 32px; text-align: center; }
    .error-icono { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 50%; display: grid; place-items: center;
      background: rgba(200,35,51,.1); color: #c82333; }
    .error-codigo { font-size: .8rem; letter-spacing: .12em; text-transform: uppercase; color: #c82333; font-weight: 700; }
    .error-tarjeta h1 { margin: 6px 0 10px; font-size: 1.6rem; }
    .error-tarjeta p { color: var(--texto-suave, #51606b); margin: 0 0 8px; }
    .error-acciones { display: flex; gap: 10px; justify-content: center; margin-top: 22px; flex-wrap: wrap; }
    .error-marca { display: flex; align-items: center; gap: 10px; justify-content: center; margin-bottom: 22px; color: var(--texto, #10222b); font-weight: 700; }
    .error-marca img { width: 34px; height: 34px; }
  </style>
</head>
<body>
  <main class="error-pagina">
    <section class="error-tarjeta" role="alert" aria-labelledby="titulo-error">
      <div class="error-marca"><img src="/static/logo.svg" alt="" aria-hidden="true">Historia Clínica Electrónica</div>
      <div class="error-icono" aria-hidden="true">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
      </div>
      <div class="error-codigo">Error {{ codigo }}</div>
      <h1 id="titulo-error">{{ titulo }}</h1>
      <p>{{ mensaje }}</p>
      {% if nota %}<p><small>{{ nota }}</small></p>{% endif %}
      <div class="error-acciones">
        <a class="btn" href="/">Ir a mi inicio</a>
        <a class="btn btn-sec" href="/auth/logout">Cambiar de usuario</a>
      </div>
    </section>
  </main>
</body>
</html>
