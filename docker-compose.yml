# docker-compose.yml — Plataforma Distribuida de Interoperabilidad Clínica
# Un solo comando: docker compose up -d

services:

  # ── Sede 1: Sincelejo (PostgreSQL :5433) ───────────────────
  pg_sede1:
    image: postgres:16-alpine
    container_name: pg_sede1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica_pass_2026}
      POSTGRES_DB: ${DB_NAME_SEDE1:-clinica_sincelejo}
    ports:
      - "${DB_PORT_SEDE1:-5433}:5432"
    volumes:
      - pg_data_sede1:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./db/sede1/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica_user} -d ${DB_NAME_SEDE1:-clinica_sincelejo}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Sede 2: Cartagena (PostgreSQL :5434) ───────────────────
  pg_sede2:
    image: postgres:16-alpine
    container_name: pg_sede2
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica_pass_2026}
      POSTGRES_DB: ${DB_NAME_SEDE2:-clinica_cartagena}
    ports:
      - "${DB_PORT_SEDE2:-5434}:5432"
    volumes:
      - pg_data_sede2:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./db/sede2/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica_user} -d ${DB_NAME_SEDE2:-clinica_cartagena}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Sede 3: Corozal (PostgreSQL :5435) ─────────────────────
  pg_sede3:
    image: postgres:16-alpine
    container_name: pg_sede3
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clinica_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clinica_pass_2026}
      POSTGRES_DB: ${DB_NAME_SEDE3:-clinica_corozal}
    ports:
      - "${DB_PORT_SEDE3:-5435}:5432"
    volumes:
      - pg_data_sede3:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/00_schema.sql:ro
      - ./db/sede3/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-clinica_user} -d ${DB_NAME_SEDE3:-clinica_corozal}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Servidor HAPI FHIR R4 (:8090) ─────────────────────────
  hapi-fhir:
    image: hapiproject/hapi:v7.2.0
    container_name: hapi_fhir
    ports:
      - "8090:8080"
    environment:
      hapi.fhir.fhir_version: R4
      hapi.fhir.server_address: http://localhost:8090/fhir
      hapi.fhir.validation_enabled: "true"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/fhir/metadata || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 6
      start_period: 25s
    restart: unless-stopped

  # ── Health Service Bus (HSB :8001) ────────────────────────
  hsb:
    build:
      context: .
      dockerfile: hsb/Dockerfile
    container_name: hsb_bus
    ports:
      - "${HSB_PORT:-8001}:8001"
    environment:
      - HAPI_FHIR_URL=http://hapi-fhir:8080/fhir
      - DB_HOST_SEDE1=pg_sede1
      - DB_PORT_SEDE1=5432
      - DB_NAME_SEDE1=${DB_NAME_SEDE1:-clinica_sincelejo}
      - DB_HOST_SEDE2=pg_sede2
      - DB_PORT_SEDE2=5432
      - DB_NAME_SEDE2=${DB_NAME_SEDE2:-clinica_cartagena}
      - DB_HOST_SEDE3=pg_sede3
      - DB_PORT_SEDE3=5432
      - DB_NAME_SEDE3=${DB_NAME_SEDE3:-clinica_corozal}
      - POSTGRES_USER=${POSTGRES_USER:-clinica_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clinica_pass_2026}
      - HSB_MAX_RETRIES=4
      - HSB_RETRY_BASE_SECONDS=1.0
    depends_on:
      hapi-fhir:
        condition: service_started
      pg_sede1:
        condition: service_healthy
      pg_sede2:
        condition: service_healthy
      pg_sede3:
        condition: service_healthy
    restart: unless-stopped

  # ── API Gateway & Vistas por Rol (:8000) ───────────────────
  api:
    build:
      context: .
      dockerfile: app/Dockerfile
    container_name: api_gateway
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - JWT_SECRET=${JWT_SECRET:-CLINICA_DISTRIBUIDA_SECRET_TOKEN_KEY_2026_HS256_UNSECURED_DEV_ONLY}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRE_MINUTES=60
      - HSB_URL=http://hsb:8001
      - HSB_METRICS_URL=http://hsb:8001/metrics
      - DB_HOST_SEDE1=pg_sede1
      - DB_PORT_SEDE1=5432
      - DB_NAME_SEDE1=${DB_NAME_SEDE1:-clinica_sincelejo}
      - DB_HOST_SEDE2=pg_sede2
      - DB_PORT_SEDE2=5432
      - DB_NAME_SEDE2=${DB_NAME_SEDE2:-clinica_cartagena}
      - DB_HOST_SEDE3=pg_sede3
      - DB_PORT_SEDE3=5432
      - DB_NAME_SEDE3=${DB_NAME_SEDE3:-clinica_corozal}
      - POSTGRES_USER=${POSTGRES_USER:-clinica_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-clinica_pass_2026}
    depends_on:
      hsb:
        condition: service_started
      pg_sede1:
        condition: service_healthy
      pg_sede2:
        condition: service_healthy
      pg_sede3:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pg_data_sede1:
  pg_data_sede2:
  pg_data_sede3:
