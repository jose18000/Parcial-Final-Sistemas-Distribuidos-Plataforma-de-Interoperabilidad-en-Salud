# db/seguridad/pg_hba.conf — quién puede entrar a cada PostgreSQL y cómo
#
# TIPO      BASE  USUARIO  DIRECCIÓN   MÉTODO
# Dentro del contenedor (docker exec, el DBA): socket local.
local       all   all                  trust
# Desde la red: SOLO con TLS y contraseña SCRAM-SHA-256.
hostssl     all   all      0.0.0.0/0   scram-sha-256
hostssl     all   all      ::/0        scram-sha-256
# Sin TLS no se entra.
host        all   all      0.0.0.0/0   reject
host        all   all      ::/0        reject
